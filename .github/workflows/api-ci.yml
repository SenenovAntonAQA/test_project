name: API tests

on:
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

# Права для деплоя GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  lint_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Docker Compose up
        working-directory: docker_folder
        run: docker compose up -d --build

      - name: Build test container
        run: docker build -t my-tests .

      - name: Run tests (host network)
        run: docker run --rm --network host my-tests